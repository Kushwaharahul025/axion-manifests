apiVersion: v1
kind: Pod
metadata:
  name: firefox-pod
  labels:
    app: firefox
spec:
  containers:
    - name: firefox-container
      image: linuxserver/firefox:1153.0.3
      ports:
        - containerPort: 3001

---

apiVersion: v1
kind: Service
metadata:
  name: firefox-service
spec:
  type: LoadBalancer
  selector:
    app: firefox
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001